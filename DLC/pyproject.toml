[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktoplut-calibrator"
version = "0.1.0"
description = "LLM-steered display calibration harness for DesktopLUT (stage tools under dlc.stages.*)"
requires-python = ">=3.11"
# The spine and contract stay dependency-free. The heavy scientific stack lives
# behind the `engine` extra (pip install -e .[engine]) and is imported only by
# dlc.engine.*; the persistent-meter ConPTY transport needs the `meter` extra
# (pywinpty), lazily imported by dlc.argyll only when --persistent-meter is used.
# See requirements.txt.
dependencies = []

[project.optional-dependencies]
engine = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "colour-science>=0.4.4,<0.5",
    "PyYAML>=6,<7",
]
# Persistent (interactive) spotread needs a Windows pseudo-console to deliver its
# trigger keystroke — the raw pipe doesn't work (box-validated 2026-06-17).
meter = [
    "pywinpty>=2.0; platform_system == 'Windows'",
]
# Everything the suite needs on a fresh box: the baked-in pytest addopts pass
# `-n auto`, so a bare pytest without xdist fails to even parse arguments.
# pytest-cov backs the audit's coverage baselines (docs/audits/fable/).
test = [
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=5,<8",
]

# The harness has no single CLI entry point: the arbitrating assistant invokes
# each stage tool as `python -m dlc.stages.<tool>`. The old `dlc = dlc.cli:main`
# console script was removed with the autopilot. A convenience entry is provided
# for the end-to-end mock rehearsal only.
[project.scripts]
dlc-simulate = "dlc.stages.simulate:main"
dlc-readout = "dlc.readout:main"
dlc-calibrate = "dlc.calibrate:main"
dlc-dashboard = "dlc.dashboard.__main__:main"
dlc-digest = "dlc.digest:main"
dlc-dogegen-server = "dlc.dogegen_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlc.dashboard" = ["assets/*"]

[tool.pytest.ini_options]
# Collect ONLY the tests/ tree — the working root holds scratch scripts (agent_*.py,
# install_native_target_test.py) whose names match pytest's *_test.py glob and would
# otherwise be collected as broken "tests".
testpaths = ["tests"]
# src layout: pytest puts src/ on sys.path so callers don't need `PYTHONPATH=src`.
pythonpath = ["src"]
# Defaults baked in so every bare `python -m pytest` is fast + clean here:
#   -p no:cacheprovider  → .pytest_cache is permission-blocked on this box.
#   -n auto              → fan the 788 tests across cores (xdist); ~261s → ~120s.
# Debugging one test? Append `-n0` to disable parallelism (lets -s / pdb work).
addopts = "-p no:cacheprovider -n auto"
markers = [
    "slow: heavy engine/optimizer CV tests (per-node SLSQP, dense cubes). Skip the inner loop with -m 'not slow'.",
]
